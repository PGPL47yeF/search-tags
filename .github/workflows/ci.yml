name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8.14.39
        env:
          CLICKHOUSE_USER: tags
          CLICKHOUSE_PASSWORD: tags
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --user tags --password tags --query 'SELECT 1'"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./... && go vet -tags integration ./...
      - name: unit tests
        run: go test -race -count=1 ./...
      - name: fuzz normalization
        run: go test -run='^$' -fuzz=FuzzQuery -fuzztime=15s ./internal/normalize
      - name: integration tests
        env:
          CLICKHOUSE_ADDR: localhost:9000
          CLICKHOUSE_USER: tags
          CLICKHOUSE_PASSWORD: tags
        run: go test -tags integration -count=1 -v ./test/integration
      - name: docker image builds
        run: docker build -t search-tags:ci .
