<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Searched}}{{.Query}} — {{end}}Поиск</title>
<style>
  :root {
    --bg: #fafaf7; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #dcdcd4; --accent: #0f766e; --accent-text: #ffffff;
    --chip: #e6f2f0; --chip-text: #0b4f49; --warn: #9a3412;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --text: #ecece6; --muted: #a3a39b;
      --line: #3a3a36; --accent: #2dd4bf; --accent-text: #0b2622;
      --chip: #233b37; --chip-text: #b6f0e6; --warn: #fdba74;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0 0 20px; font-size: 22px; font-weight: 600; }
  form { display: flex; gap: 8px; }
  input[type=search] { flex: 1; min-width: 0; padding: 10px 14px; font: inherit; color: inherit;
         background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer;
         color: var(--accent-text); background: var(--accent); border: 0; border-radius: 8px; }
  .tags { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 0; padding: 0; }
  .tags a { display: inline-block; padding: 6px 12px; border-radius: 6px; text-decoration: none;
         background: var(--chip); color: var(--chip-text); }
  .tags a:hover, .tags a:focus-visible { text-decoration: underline; }
  .note { margin: 20px 0 0; color: var(--muted); }
  .note.problem { color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>Поиск по каталогу</h1>
  <form action="/" method="get" role="search">
    <input type="search" name="q" value="{{.Query}}" placeholder="Например, платье" aria-label="Поисковый запрос" autofocus>
    <button type="submit">Найти</button>
  </form>
  {{- if .Problem}}
  <p class="note problem" role="alert">{{.Problem}}</p>
  {{- else if .Tags}}
  <ul class="tags" aria-label="С этим запросом также ищут">
    {{- range .Tags}}
    <li><a href="/?q={{.Tag}}">{{.Tag}}</a></li>
    {{- end}}
  </ul>
  {{- else if .Searched}}
  <p class="note">Для этого запроса пока нет тегов</p>
  {{- end}}
</main>
</body>
</html>
